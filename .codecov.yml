codecov:
  require_ci_to_pass: true

coverage:
  precision: 1
  round: down
  range: "70...100"
  status:
    project:
      default:
        target: 85%
        threshold: 1%
    patch:
      default:
        target: 85%

comment:
  layout: "reach,diff,flags,files,footer"
  behavior: default
  require_changes: false
