[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "specsynth"
version = "1.0.0"
description = "Distributed, out-of-core stellar population synthesis (SPS) powered by Dask and Zarr"
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
authors = [
    { name = "Sankar Ganesh", email = "b.sankarganesh@gmail.com" }
]
classifiers = [
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Scientific/Engineering :: Astronomy",
    "Topic :: Scientific/Engineering :: Physics",
]
dependencies = [
    "numpy>=2.0",
    "dask[distributed]>=2024.12",
    "zarr>=2.16",
    "fsspec>=2024.6",
    "psutil>=5.9",
]

[project.optional-dependencies]
storage = [
    "s3fs",
    "gcsfs",
    "adlfs",
]
astro = [
    "astropy>=5.0",
    "h5py>=3.8",
    "pyarrow>=10.0",
]
gpu = [
    "cupy-cuda12x>=13.0",
]
test = [
    "pytest>=7.0",
    "pytest-cov>=4.0",
    "astropy>=5.0",
    "h5py>=3.8",
]

[project.scripts]
specsynth = "specsynth.cli:main"

[tool.setuptools.packages.find]
include = ["specsynth*"]

[tool.setuptools.package-data]
"specsynth" = ["data/filters/*.csv"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
pythonpath = ["."]
markers = [
    "critical: Tier 1 - Core numerical contractions, BLAS, finite-flux, and energy conservation",
    "astrophysics: Tier 2 - Astrophysical invariants (D4000 break, UV slopes, Madau IGM, filter projections, cosmology)",
    "sentry: Tier 3 & 4 - Population bimodality, fault containment, quarantine, and audit reports",
    "integration: End-to-end multi-chunk pipelines, CLI subcommands, and agent tools",
]
addopts = "-v --strict-markers"
