apiVersion: kubernetes.dask.org/v1
kind: DaskCluster
metadata:
  name: synth-pvc
  namespace: default
  labels:
    app.kubernetes.io/name: specsynth
    app.kubernetes.io/part-of: specsynth-framework
spec:
  worker:
    replicas: 3
    spec:
      volumes:
        - name: shared-data
          persistentVolumeClaim:
            claimName: specsynth-data-pvc
      containers:
        - name: worker
          image: docker.io/bsankarganesh/specsynth:latest
          imagePullPolicy: IfNotPresent
          command: ["dask", "worker"]
          args: [
            "tcp://synth-pvc-scheduler:8786",
            "--name", "$(DASK_WORKER_NAME)",
            "--nthreads", "1",
            "--memory-limit", "3GiB"
          ]
          resources:
            requests: { cpu: "500m", memory: "1Gi" }
            limits:   { cpu: "1", memory: "3Gi" }
          volumeMounts:
            - name: shared-data
              mountPath: /data
  scheduler:
    spec:
      volumes:
        - name: shared-data
          persistentVolumeClaim:
            claimName: specsynth-data-pvc
      containers:
        - name: scheduler
          image: docker.io/bsankarganesh/specsynth:latest
          imagePullPolicy: IfNotPresent
          command: ["dask", "scheduler"]
          ports:
            - { name: tcp-comm, containerPort: 8786 }
            - { name: http-dashboard, containerPort: 8787 }
          volumeMounts:
            - name: shared-data
              mountPath: /data
    service:
      type: ClusterIP
      selector:
        dask.org/cluster-name: synth-pvc
        dask.org/component: scheduler
      ports:
        - { name: tcp-comm, port: 8786, targetPort: tcp-comm }
        - { name: http-dashboard, port: 8787, targetPort: http-dashboard }
