# Requires the Dask Kubernetes Operator:
#   helm install --repo https://helm.dask.org --create-namespace -n dask-operator \
#        --generate-name dask-kubernetes-operator
# Scheduler service becomes:  tcp://synth-scheduler:8786
apiVersion: kubernetes.dask.org/v1
kind: DaskCluster
metadata:
  name: synth
spec:
  worker:
    replicas: 8
    spec:
      containers:
        - name: worker
          image: YOUR_REGISTRY/specsynth:latest
          imagePullPolicy: IfNotPresent
          command: ["dask", "worker"]
          args: ["tcp://synth-scheduler:8786", "--name", "$(DASK_WORKER_NAME)", "--nthreads", "1", "--memory-limit", "7GiB"]
          resources:
            requests: { cpu: "1", memory: "8Gi" }
            limits:   { cpu: "1", memory: "8Gi" }
          # credentials via your cloud's workload identity / IRSA, or:
          # envFrom: [{ secretRef: { name: object-store-credentials } }]
  scheduler:
    spec:
      containers:
        - name: scheduler
          image: YOUR_REGISTRY/specsynth:latest
          command: ["dask", "scheduler"]
          ports:
            - { name: tcp-comm, containerPort: 8786 }
            - { name: http-dashboard, containerPort: 8787 }
    service:
      type: ClusterIP
      selector:
        dask.org/cluster-name: synth
        dask.org/component: scheduler
      ports:
        - { name: tcp-comm, port: 8786, targetPort: tcp-comm }
        - { name: http-dashboard, port: 8787, targetPort: http-dashboard }
