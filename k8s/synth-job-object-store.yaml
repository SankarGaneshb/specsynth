apiVersion: batch/v1
kind: Job
metadata:
  name: specsynth-run-object-store
  namespace: default
  labels:
    app.kubernetes.io/name: specsynth
    app.kubernetes.io/component: object-store-job
spec:
  backoffLimit: 0
  template:
    metadata:
      labels:
        app.kubernetes.io/name: specsynth
    spec:
      restartPolicy: Never
      containers:
        - name: client
          image: docker.io/bsankarganesh/specsynth:latest
          imagePullPolicy: IfNotPresent
          env:
            - name: S3_BUCKET
              valueFrom:
                configMapKeyRef:
                  name: specsynth-s3-config
                  key: bucket-name
                  optional: true
            - name: AWS_ENDPOINT_URL
              valueFrom:
                configMapKeyRef:
                  name: specsynth-s3-config
                  key: endpoint-url
                  optional: true
            - name: AWS_ACCESS_KEY_ID
              valueFrom:
                secretKeyRef:
                  name: specsynth-s3-credentials
                  key: access-key-id
                  optional: true
            - name: AWS_SECRET_ACCESS_KEY
              valueFrom:
                secretKeyRef:
                  name: specsynth-s3-credentials
                  key: secret-access-key
                  optional: true
            - name: AWS_DEFAULT_REGION
              value: "us-east-1"
          command: ["/bin/sh", "-c"]
          args:
            - |
              set -e
              BUCKET="${S3_BUCKET:-specsynth-data}"
              BASE="s3://${BUCKET}/runs/run-$(date +%s)"
              S="python /app/specsynth.py --base $BASE --scheduler tcp://synth-s3-scheduler:8786"
              echo "[*] Running Specsynth in Pure Cloud-Native Object-Store Mode..."
              echo "[*] Base Storage URI: $BASE"
              echo "[*] Step 1: Generating SSP library directly to Object Store..."
              $S make-ssp --adapter toy --n-age 30 --n-met 4 --n-wave 2000
              echo "[*] Step 2: Generating SFH for 100,000 galaxies directly to Object Store..."
              $S make-sfh --n-gal 100000 --chunk 20000
              echo "[*] Step 3: Running Distributed In-Flight Synthesis (zero shared disk mounts)..."
              $S synth --filters jwst_nircam --redshift 2.0 --igm --batch-chunks 2
              echo "[*] Step 4: Verifying numerical accuracy from Object Store..."
              $S verify
              echo "[+] Cloud-Native Object-Store Synthesis Run Completed Successfully!"
          resources:
            requests: { cpu: "500m", memory: "1Gi" }
            limits:   { cpu: "1", memory: "2Gi" }
