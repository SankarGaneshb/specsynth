apiVersion: batch/v1
kind: Job
metadata:
  name: specsynth-run-pvc
  namespace: default
  labels:
    app.kubernetes.io/name: specsynth
    app.kubernetes.io/component: benchmark-job
spec:
  backoffLimit: 0
  template:
    metadata:
      labels:
        app.kubernetes.io/name: specsynth
    spec:
      restartPolicy: Never
      volumes:
        - name: shared-data
          persistentVolumeClaim:
            claimName: specsynth-data-pvc
      containers:
        - name: client
          image: docker.io/bsankarganesh/specsynth:latest
          imagePullPolicy: IfNotPresent
          volumeMounts:
            - name: shared-data
              mountPath: /data
          command: ["/bin/sh", "-c"]
          args:
            - |
              set -e
              BASE=/data/run_persistent
              rm -rf $BASE && mkdir -p $BASE
              S="python /app/specsynth.py --base $BASE --scheduler tcp://synth-pvc-scheduler:8786"
              echo "[*] Step 1: Generating SSP library (30 ages x 4 metallicities x 2000 wave)..."
              $S make-ssp --adapter toy --n-age 30 --n-met 4 --n-wave 2000
              echo "[*] Step 2: Generating SFH for 100,000 galaxies across persistent cluster..."
              $S make-sfh --n-gal 100000 --chunk 20000
              echo "[*] Step 3: Running Distributed In-Flight Synthesis with bounded scheduler..."
              $S synth --filters jwst_nircam --redshift 2.0 --igm --batch-chunks 2
              echo "[*] Step 4: Verifying numerical accuracy..."
              $S verify
              echo "[+] Persistent Volume Benchmark Run Completed Successfully!"
          resources:
            requests: { cpu: "500m", memory: "1Gi" }
            limits:   { cpu: "1", memory: "2Gi" }
