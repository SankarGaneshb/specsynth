apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: specsynth-data-pvc
  namespace: default
  labels:
    app.kubernetes.io/name: specsynth
    app.kubernetes.io/component: storage
spec:
  accessModes:
    - ReadWriteMany
  resources:
    requests:
      storage: 50Gi
  # storageClassName can be set to oci-fss, efs-sc, standard, or left default
