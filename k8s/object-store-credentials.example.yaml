# Example ConfigMap and Secret for Object-Store-Native Specsynth Execution
# Compatible with AWS S3, Cloudflare R2, MinIO, Ceph, and OCI Object Storage S3-compatible API.
apiVersion: v1
kind: ConfigMap
metadata:
  name: specsynth-s3-config
  namespace: default
data:
  bucket-name: "specsynth-benchmarks"
  endpoint-url: "https://compat.objectstorage.us-ashburn-1.oraclecloud.com" # or https://s3.amazonaws.com
---
apiVersion: v1
kind: Secret
metadata:
  name: specsynth-s3-credentials
  namespace: default
type: Opaque
stringData:
  access-key-id: "YOUR_ACCESS_KEY_ID"
  secret-access-key: "YOUR_SECRET_ACCESS_KEY"
