name: OCI Multi-Node Cloud Benchmark

on:
  workflow_dispatch:
    inputs:
      nodes:
        description: 'Number of worker nodes to spin up'
        required: true
        default: '3'
        type: choice
        options:
          - '1'
          - '2'
          - '3'
          - '4'
          - '6'
          - '8'
      n_galaxies:
        description: 'Number of mock galaxies to synthesize'
        required: true
        default: '100000'
        type: string

jobs:
  run-benchmark:
    runs-on: ubuntu-latest
    env:
      OCI_CLI_USER: ${{ secrets.OCI_USER_OCID }}
      OCI_CLI_TENANCY: ${{ secrets.OCI_TENANCY_OCID }}
      OCI_CLI_FINGERPRINT: ${{ secrets.OCI_FINGERPRINT }}
      OCI_CLI_KEY_FILE: /home/runner/.oci/oci_api_key.pem
      OCI_CLI_REGION: ${{ secrets.OCI_REGION || 'ap-hyderabad-1' }}
      OCI_CLUSTER_OCID: ${{ secrets.OCI_CLUSTER_OCID }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install OCI CLI & Save Private Key
        env:
          KEY_DATA: ${{ secrets.OCI_PRIVATE_KEY }}
        run: |
          pip install --no-cache-dir oci-cli
          mkdir -p ~/.oci
          echo "$KEY_DATA" > ~/.oci/oci_api_key.pem
          chmod 600 ~/.oci/oci_api_key.pem
          oci --version

      - name: Set up kubectl
        uses: azure/setup-kubectl@v4
        with:
          version: 'v1.36.1'

      - name: Configure Cluster Kubeconfig
        run: |
          oci ce cluster create-kubeconfig \
            --cluster-id ${{ secrets.OCI_CLUSTER_OCID }} \
            --file $HOME/.kube/config \
            --region ${{ secrets.OCI_REGION || 'ap-hyderabad-1' }} \
            --token-version 2.0.0 \
            --kube-endpoint PUBLIC_ENDPOINT

      - name: Run Ephemeral Multi-Node Benchmark
        run: |
          chmod +x scripts/run_oci_benchmark.sh
          ./scripts/run_oci_benchmark.sh "${{ inputs.nodes }}" "${{ inputs.n_galaxies }}"
