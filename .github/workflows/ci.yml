name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13"]

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Set up Python ${{ matrix.python-version }}
      uses: actions/setup-python@v5
      with:
        python-version: ${{ matrix.python-version }}
        cache: 'pip'

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -e ".[test,astro]"

    - name: Run unit tests with coverage
      run: |
        pytest -v --cov=specsynth --cov-report=xml --cov-report=term

    - name: End-to-End Multi-Format & SPS Adapter Validation (Phases 2-4)
      run: |
        python scripts/test_end_to_end_validation.py
    
    - name: Upload coverage reports to Codecov
      uses: codecov/codecov-action@v5
      with:
        files: ./coverage.xml
        fail_ci_if_error: false

  frontend:
    name: Frontend Test & Build (PerandamΨ)
    runs-on: ubuntu-latest
    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Set up Node.js
      uses: actions/setup-node@v4
      with:
        node-version: 22
        cache: 'npm'
        cache-dependency-path: perandam-psi/package-lock.json

    - name: Install frontend dependencies
      working-directory: perandam-psi
      run: npm ci

    - name: Run frontend unit tests
      working-directory: perandam-psi
      run: npm test

    - name: Build frontend application
      working-directory: perandam-psi
      run: npm run build
