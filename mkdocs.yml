      - Troubleshooting: guides/troubleshooting.md
      - SSP Model Adapters: guides/adapters.md
      - Catalogs, Cosmology & Filters: guides/catalogs-and-photometry.md
      - Distributed, Cloud & GPU Execution: guides/distributed-and-gpu.md
      - Validation & Benchmarks: guides/validation-and-benchmarks.md
